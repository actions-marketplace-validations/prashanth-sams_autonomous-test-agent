# PR-driven autonomous testing.
#
# Runs this repository's own Action (`uses: ./`), so every PR also tests the
# Action as other repositories use it. The agent reads the diff, maps it to
# affected journeys, tests them on the preview environment and posts an
# evidence-backed recommendation on the PR.
name: QA Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The agent needs both sides of the diff to analyse impact.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only the demo app is built here: it has to be running before the Action
      # starts, and the Action builds the agent and installs Chromium itself.
      - run: npm ci
      - run: npm run build --workspace examples/demo-app

      # Replace with the real preview environment for the PR.
      - name: Start the application under test
        run: |
          node examples/demo-app/dist/server.js &
          npx wait-on http://localhost:4321 --timeout 30000

      # Uploads the evidence, posts the report on the PR (replacing the previous
      # one) and fails the job only when the agent could not execute. The config
      # is advisory, so a defect never blocks the merge.
      - name: Run the agent against the changed areas
        uses: ./
        with:
          url: ${{ vars.PREVIEW_URL || 'http://localhost:4321' }}
          config: agent.example.yaml
          comment: 'true'
          