# Keeps the floating major tag (v1, v2, ...) on the latest release so users can
# pin `prashanth-sams/autonomous-test-agent@v1` and pick up fixes automatically.
name: Update major version tag

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move-tag:
    # Prereleases must not reach users who pinned the major tag.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the major tag at this release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$TAG' is not vX.Y.Z; leaving the major tag alone."
            exit 0
          fi
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "$MAJOR"
          echo "Moved $MAJOR to $TAG ($GITHUB_SHA)."
