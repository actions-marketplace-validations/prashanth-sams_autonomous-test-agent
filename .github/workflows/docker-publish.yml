# Builds the Docker image and tests it against the demo shop. When a release is
# published, it also pushes the image to GitHub Container Registry:
#
#   ghcr.io/prashanth-sams/autonomous-test-agent:1.2.3    that release
#   ghcr.io/prashanth-sams/autonomous-test-agent:1.2      newest 1.2.x
#   ghcr.io/prashanth-sams/autonomous-test-agent:1        newest 1.x.x
#   ghcr.io/prashanth-sams/autonomous-test-agent:latest   newest release
#
# A prerelease pushes only its own version tag. Pull requests that change the
# image are built and tested, never pushed. Release steps: docs/publishing.md.
name: Docker image

on:
  release:
    types: [published]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - agent.example.yaml
      - package-lock.json
      - '**/package.json'
      - 'tsconfig*.json'
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: autonomous-test-agent:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print the CLI help
        run: docker run --rm autonomous-test-agent:local --help

      # The demo shop has planted bugs, so a working image reports them: exit
      # code 1 (review) or 2 (block). A pass or an agent error means it's broken.
      - name: Explore the demo shop
        run: |
          set +e
          docker compose up --no-build --exit-code-from agent
          code=$?
          set -e
          case "$code" in
            1|2) echo "The agent reported the demo shop's bugs (exit code $code)." ;;
            *) echo "::error::Expected exit code 1 or 2 from the demo run; got $code."; exit 1 ;;
          esac

      - name: Upload the demo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-demo-run
          path: runs/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Lets the amd64 runner build the arm64 image.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: set the DOCKERHUB_IMAGE variable and the DOCKERHUB_USERNAME
      # and DOCKERHUB_TOKEN secrets to publish to Docker Hub as well.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        env:
          # A multi-platform image shows its description from the index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_IMAGE }}
          # Like update-major-tag.yml, a prerelease moves no floating tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
          flavor: |
            latest=${{ github.event.release.prerelease && 'false' || 'auto' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
